<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jeanne chat</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 16px/1.55 Georgia, "Times New Roman", serif;
    background: #FEFAF6; color: #1a1a1a;
    display: flex; flex-direction: column; height: 100dvh;
  }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  #col { max-width: 640px; margin: 0 auto; }
  .msg { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user { background: #efece3; margin-left: auto; max-width: 85%; width: fit-content; }
  .msg.assistant { background: #f0efea; }
  .msg img.att { max-width: 200px; max-height: 200px; border-radius: 8px; display: block; margin: 6px 0; }
  .msg .sources { margin-top: 8px; font-size: 13px; }
  .msg .sources a { display: block; color: #c96442; text-decoration: none; overflow-wrap: anywhere; }
  .msg .sources a:hover { text-decoration: underline; }
  .msg a { color: #c96442; }
  .searching { font-size: 12px; opacity: .6; font-style: italic; }
  #composer { padding: 12px 14px calc(16px + env(safe-area-inset-bottom)); max-width: 668px; width: 100%; margin: 0 auto; }
  #thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  #thumbs .thumb { position: relative; }
  #thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
  #thumbs .rm {
    position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
    border: 0; background: #c96442; color: #fff; font-size: 12px; line-height: 20px; padding: 0; cursor: pointer;
  }
  #row { display: flex; gap: 8px; }
  #composer textarea {
    flex: 1; resize: none; padding: 10px 12px; border: 1px solid #ccc; border-radius: 12px;
    font: inherit; max-height: 160px; background: #fff;
  }
  button { padding: 6px 14px; border: 0; border-radius: 8px; background: #c96442; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #imgbtn { background: #efece3; color: #1a1a1a; }
  .err { color: #c0392b; font-size: 13px; margin: 0 0 12px; }

  @media (max-width: 640px) {
    body { font-size: 15px; }
    #chat { padding: 10px; }
    .msg { padding: 8px 12px; }
    .msg.user { max-width: 92%; }
    .msg img.att { max-width: 150px; max-height: 150px; }
    #composer { padding: 8px 10px calc(12px + env(safe-area-inset-bottom)); }
    #composer textarea { font-size: 16px; } /* prevents iOS zoom-on-focus */
    #thumbs img { width: 52px; height: 52px; }
    #gate input { width: min(260px, 80vw); }
  }

  #gate {
    position: fixed; inset: 0; background: #FEFAF6; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; z-index: 10;
  }
  #gate input { padding: 10px 14px; border: 1px solid #ccc; border-radius: 10px; font: inherit; width: 260px; background: #fff; }
  #gate .bad { color: #c0392b; font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>

<div id="gate">
  <div>Password</div>
  <input id="pw" type="password" autofocus>
  <button id="unlock">Enter</button>
  <div class="bad" id="pwerr"></div>
</div>

<div id="chat"><div id="col"></div></div>

<div id="composer">
  <div id="thumbs"></div>
  <div id="row">
    <button id="imgbtn" title="Attach images">📎</button>
    <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
    <textarea id="input" rows="2" placeholder="Ask anything… (Enter to send, Shift+Enter for newline, paste images ok)"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
const MODEL = "claude-opus-4-8";

// API key encrypted with the page password (PBKDF2-SHA256 600k + AES-256-GCM).
// Only ciphertext ships in this file; the password is the decryption key.
const ENC = {
  salt: "jJloqL8yrCb5KgqJprRvzQ==",
  iv: "yAOLPs+q46W6MWy3",
  ct: "yEHU9xEB7VamY8gEDJ8w7+jN0jTjUq+L/zuYu2cIcD6tHV2/miT9K6XQhNGiA+WFcHhgbIPSwr7cFhk5CDfb36GXIOdGb6xdjbmtuaxrQ5NEc2jU3MGPWOo6EOmEZPgw4PY6ZXaVqJwcNpXUBnAmiacIYVwRI2D2+pP7SA=="
};

const chat = document.getElementById("chat");
const col = document.getElementById("col");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const thumbs = document.getElementById("thumbs");
const fileInput = document.getElementById("file");

let apiKey = null;
let messages = [];      // in-memory only
let pending = [];       // attached images awaiting send: {media_type, data(b64), url}
let busy = false;

// ---------- password gate ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function tryUnlock() {
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("pwerr");
  err.textContent = "";
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const dk = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(ENC.salt), iterations: 600000, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, dk, b64(ENC.ct));
    apiKey = new TextDecoder().decode(pt);
    sessionStorage.setItem("pw", pw);
    document.getElementById("gate").remove();
    input.focus();
  } catch (e) {
    err.textContent = "Wrong password.";
  }
}
document.getElementById("unlock").onclick = tryUnlock;
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
// auto-unlock within the same tab session
if (sessionStorage.getItem("pw")) {
  document.getElementById("pw").value = sessionStorage.getItem("pw");
  tryUnlock();
}

// ---------- image attachments ----------
document.getElementById("imgbtn").onclick = () => fileInput.click();
fileInput.onchange = () => { for (const f of fileInput.files) addImage(f); fileInput.value = ""; };
document.addEventListener("paste", e => {
  for (const item of e.clipboardData?.items || []) {
    if (item.type.startsWith("image/")) { addImage(item.getAsFile()); e.preventDefault(); }
  }
});

function addImage(file) {
  if (!file || !/^image\/(png|jpeg|gif|webp)$/.test(file.type)) return;
  if (file.size > 4 * 1024 * 1024) { addErr("Image too big (4 MB max): " + (file.name || "pasted image")); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const url = reader.result;                       // data:image/png;base64,....
    const data = url.slice(url.indexOf(",") + 1);
    const att = { media_type: file.type, data, url };
    pending.push(att);
    const wrap = document.createElement("div");
    wrap.className = "thumb";
    const img = document.createElement("img");
    img.src = url;
    const rm = document.createElement("button");
    rm.className = "rm"; rm.textContent = "✕";
    rm.onclick = () => { pending = pending.filter(p => p !== att); wrap.remove(); };
    wrap.append(img, rm);
    thumbs.appendChild(wrap);
  };
  reader.readAsDataURL(file);
}

// ---------- chat ----------
function addMsg(cls, text, imgUrls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  for (const u of imgUrls || []) {
    const im = document.createElement("img");
    im.className = "att"; im.src = u;
    d.appendChild(im);
  }
  if (text) d.append(text);
  col.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function addErr(text) {
  const d = document.createElement("div");
  d.className = "err"; d.textContent = text;
  col.appendChild(d); chat.scrollTop = chat.scrollHeight;
}

async function apiCall(body) {
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    let msg = resp.status + " " + resp.statusText;
    try { msg = (await resp.json()).error.message; } catch (e) {}
    throw new Error(msg);
  }
  return resp;
}

async function readSSE(resp, onEvent) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      if (line.startsWith("data: ")) {
        try { onEvent(JSON.parse(line.slice(6))); } catch (e) {}
      }
    }
  }
}

async function send() {
  if (busy || !apiKey) return;
  const text = input.value.trim();
  if (!text && !pending.length) return;

  busy = true; sendBtn.disabled = true;
  input.value = "";
  const atts = pending; pending = []; thumbs.innerHTML = "";

  addMsg("user", text, atts.map(a => a.url));
  const content = [
    ...atts.map(a => ({ type: "image", source: { type: "base64", media_type: a.media_type, data: a.data } })),
    ...(text ? [{ type: "text", text }] : []),
  ];
  messages.push({ role: "user", content });

  const bubble = addMsg("assistant", "");
  const searchNote = document.createElement("div");
  searchNote.className = "searching";

  try {
    for (let attempt = 0; attempt < 6; attempt++) {   // pause_turn resume loop
      const resp = await apiCall({
        model: MODEL,
        max_tokens: 64000,
        stream: true,
        thinking: { type: "adaptive" },
        system: "You are a helpful assistant. When a question benefits from current information, use web search and cite sources. Keep answers focused.",
        tools: [{ type: "web_search_20260209", name: "web_search", max_uses: 5 }],
        messages,
      });

      const blocks = [];
      let stopReason = null;
      let renderedText = "";
      const cites = [];

      await readSSE(resp, (ev) => {
        if (ev.type === "content_block_start") {
          blocks[ev.index] = structuredClone(ev.content_block);
          if (ev.content_block.type === "server_tool_use") {
            searchNote.textContent = "searching the web…";
            bubble.appendChild(searchNote);
          }
        } else if (ev.type === "content_block_delta") {
          const b = blocks[ev.index];
          const d = ev.delta;
          if (d.type === "text_delta") {
            b.text = (b.text || "") + d.text;
            renderedText += d.text;
            renderText(bubble, renderedText, cites);
          } else if (d.type === "thinking_delta") {
            b.thinking = (b.thinking || "") + d.thinking;
          } else if (d.type === "signature_delta") {
            b.signature = (b.signature || "") + d.signature;
          } else if (d.type === "input_json_delta") {
            b._partial = (b._partial || "") + d.partial_json;
          } else if (d.type === "citations_delta") {
            b.citations = b.citations || [];
            b.citations.push(d.citation);
            if (d.citation.url && !cites.some(c => c.url === d.citation.url)) {
              cites.push({ url: d.citation.url, title: d.citation.title || d.citation.url });
            }
            renderText(bubble, renderedText, cites);
          }
        } else if (ev.type === "content_block_stop") {
          const b = blocks[ev.index];
          if (b && b._partial !== undefined) {
            try { b.input = JSON.parse(b._partial || "{}"); } catch (e) { b.input = {}; }
            delete b._partial;
          }
        } else if (ev.type === "message_delta") {
          stopReason = ev.delta.stop_reason;
        }
      });

      searchNote.remove();
      messages.push({ role: "assistant", content: blocks.filter(Boolean) });

      if (stopReason !== "pause_turn") {
        if (stopReason === "refusal") addErr("Model declined to answer that.");
        if (!renderedText && stopReason !== "refusal") bubble.textContent = "(no text response)";
        break;
      }
    }
  } catch (e) {
    searchNote.remove();
    addErr("Error: " + e.message);
    while (messages.length && messages[messages.length - 1].role !== "user") messages.pop();
    messages.pop();
    if (!bubble.textContent) bubble.remove();
  } finally {
    busy = false; sendBtn.disabled = false;
    input.focus();
  }
}

// Turn markdown [text](url) and bare URLs into <a> elements (DOM-built, no innerHTML).
function linkify(el, text) {
  el.textContent = "";
  const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>"')\]]+)/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    el.append(text.slice(last, m.index));
    const a = document.createElement("a");
    a.target = "_blank"; a.rel = "noopener";
    if (m[1]) {
      a.href = m[2]; a.textContent = m[1];
      last = re.lastIndex;
    } else {
      let url = m[3];
      const trail = url.match(/[.,;:!?]+$/);   // don't swallow trailing punctuation
      if (trail) url = url.slice(0, -trail[0].length);
      a.href = url; a.textContent = url;
      last = m.index + url.length;
      re.lastIndex = last;
    }
    el.appendChild(a);
  }
  el.append(text.slice(last));
}

function renderText(el, text, cites) {
  linkify(el, text);
  if (cites.length) {
    const src = document.createElement("div");
    src.className = "sources";
    src.append("Sources:");
    for (const c of cites) {
      const a = document.createElement("a");
      a.href = c.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = c.title;
      src.appendChild(a);
    }
    el.appendChild(src);
  }
  chat.scrollTop = chat.scrollHeight;
}

sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
